<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title>
      MyTalk Audio
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <div id="container">
    <div *ngIf="!isRegistered">
      <ion-item>
        <ion-label position="floating">Your User ID</ion-label>
        <ion-input [(ngModel)]="myId" placeholder="Enter simple ID (e.g. user1)"></ion-input>
      </ion-item>
      <div class="ion-padding-top">
        <ion-button expand="block" (click)="register()" [disabled]="!myId">
          Register / Login
        </ion-button>
      </div>
    </div>

    <div *ngIf="isRegistered">
      <ion-card>
        <ion-card-header>
          <ion-card-title>Status: Online</ion-card-title>
          <ion-card-subtitle>ID: {{ myId }}</ion-card-subtitle>
        </ion-card-header>
        <ion-card-content>
          Ready to receive announcements...
        </ion-card-content>
      </ion-card>

      <ion-item class="ion-margin-top">
        <ion-label position="floating">Target User ID</ion-label>
        <ion-input [(ngModel)]="targetId" placeholder="Who to call?"></ion-input>
      </ion-item>
      
      <div class="ion-padding-top">
        <ion-button expand="block" color="danger" (click)="startAnnouncement()" [disabled]="!targetId">
          Start Announcement (Talk)
        </ion-button>
      </div>
    </div>
  </div>
</ion-content>
